name: Bug report
description: Report a reproducible issue without including sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior. Never include credentials or private prompts.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
