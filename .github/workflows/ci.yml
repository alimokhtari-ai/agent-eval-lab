name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile source
        run: python -m compileall -q src
      - name: Validate versioned task suite
        env:
          PYTHONPATH: src
        run: python -m agent_eval_lab validate evals/core_suite.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run deterministic suite and write reports
        env:
          PYTHONPATH: src
        run: python -m agent_eval_lab run --tasks evals/core_suite.json --adapter mock --json-out artifacts/core-mock.json --html-out artifacts/core-mock.html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel without runtime dependencies
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed package
        run: python -m pip install dist/*.whl && agent-eval validate evals/core_suite.json
